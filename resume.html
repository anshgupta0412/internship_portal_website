<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Upload - Internship Hub</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MSG_ID",
      appId: "YOUR_APP_ID"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
  </script>
</head>
<body>
  <header>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Internship<span>Hub</span></a>
            </div>
            <div class="nav-links">
                <ul>
                     <li><a href="index.html#hero">Home</a></li>
                   <!-- 🔽 Industries Dropdown -->
      <li>
        <div class="dropdown">
          <a href="#" class="dropbtn">Industries</a>
          <div class="dropdown-content">
            <a href="software.html">Software Engineering</a>
            <a href="marketing.html">Marketing</a>
            <a href="finance.html">Finance</a>
            <a href="design.html">Design</a>
            <a href="teaching.html">Teaching</a>
            <a href="medical.html">Medical</a>
          </div>
        </div>
      </li>
                     <!-- 🔽 Info Dropdown (How it Works + FAQ) -->
                     <li>
                      <div class="dropdown">
                          <a href="#" class="dropbtn">Info</a>
                              <div class="dropdown-content">
                                  <a href="how-it-works.html">How It Works</a>
                          <a href="faq.html">FAQ</a>
                               </div>
                      </div>
                  </li>
                    <li><a href="resume.html">Resume</a></li>

                </ul>
            </div>
            <div class="auth-links">
              <ul>
                <li><a href="login.html" class="auth-button">Login</a></li>
                <li><a href="signup.html" class="signup-button">Sign Up</a></li> 
                <li><a href="profile.html">Profile</a></li>
              </ul>
            </div>
        </nav>
    </header>
  </header>

  <main class="container">
    <h1>Upload Your Resume</h1>
    <form id="resumeForm" enctype="multipart/form-data">
      <input type="text" name="fullname" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>
      <textarea name="summary" placeholder="Short Resume Summary" required></textarea>
      <input type="file" id="resumeFile" name="resumeFile" accept=".pdf,.doc,.docx" required>
      <button type="submit">Upload Resume</button>
    </form>

    <div id="resumePreviewContainer" style="display:none;">
      <h2>Preview:</h2>
      <iframe id="resumePreview" width="100%" height="400px"></iframe>
    </div>
  </main>

  <footer>
    <div class="footer-content">
        <p>© 2025 Fresher Internship Hub</p>
        <ul>
           <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </div>
</footer>
  <script>
    const form = document.getElementById('resumeForm');
    const previewContainer = document.getElementById('resumePreviewContainer');
    const previewFrame = document.getElementById('resumePreview');

    form.resumeFile.addEventListener('change', function () {
      const file = this.files[0];
      if (file && file.type === 'application/pdf') {
        previewFrame.src = URL.createObjectURL(file);
        previewContainer.style.display = 'block';
      } else {
        previewContainer.style.display = 'none';
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const fullname = form.fullname.value;
      const email = form.email.value;
      const phone = form.phone.value;
      const summary = form.summary.value;
      const file = form.resumeFile.files[0];

      if (!file || !fullname || !email || !phone || !summary) {
        alert("All fields are required.");
        return;
      }

      const fileName = `${fullname}_${Date.now()}_${file.name}`;
      const storageRef = storage.ref(`resumes/${fileName}`);

      try {
        const snapshot = await storageRef.put(file);
        const resumeURL = await snapshot.ref.getDownloadURL();

        await db.collection("resumes").add({
          fullname,
          email,
          phone,
          summary,
          resumeURL,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Resume uploaded successfully!");
        form.reset();
        previewContainer.style.display = 'none';
      } catch (error) {
        console.error("Upload failed", error);
        alert("Upload failed. Try again.");
      }
    });
  </script>
</body>
</html>
